name: Generate contribution snake

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/contribution-snake.yml"

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate light and dark SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%232ac3de&color_dots=%23ebedf0,%23b4c6e7,%237aa2f7,%23bb9af7,%23e0af68
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23e0af68&color_dots=%231a1b26,%2324263b,%23414e73,%237aa2f7,%23bb9af7

      - name: Publish SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@c0d7ff0487ee0415efb7f32dab10ea880330b1dd # v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
