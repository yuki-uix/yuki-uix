<svg xmlns="http://www.w3.org/2000/svg" width="600" height="302" viewBox="0 0 600 302" role="img" aria-labelledby="title desc">
<title id="title">Yuki's terminal introduction</title>
<desc id="desc">A terminal session. yuki whoami prints an ASCII cat beside: hi, i'm yuki. I build AI agents, eval systems, and developer tools. yuki background prints: I studied architecture before I wrote code. yuki what-keeps-me-curious prints: the jump from it works to it's useful, building it, testing it, finding out.</desc>
<defs><clipPath id="inner"><rect x="1" y="35" width="598" height="266"/></clipPath></defs>
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;font-size:13px;fill:#1f2328;font-variant-ligatures:none}
.win{fill:#ffffff;stroke:#d0d7de}
.bar{fill:#f6f8fa}
.edge{stroke:#d0d7de}
.title{font-size:11px;fill:#656d76}
.p{fill:#0969da}
.out{fill:#59636e}
.pet{fill:#8250df}
.cover{fill:#ffffff}
.cur,.caret{fill:#0969da}
@keyframes show{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
@keyframes gone{to{opacity:0}}
.blk{animation:show .01s both}
.b0{animation-delay:0.25s}
.b1{animation-delay:1.052s}
.b2{animation-delay:1.902s}
.t0{animation:ty0 0.352s steps(11,end) 0.25s forwards,gone .01s 0.622s forwards}
@keyframes ty0{to{transform:translateX(85.8px)}}
.t1{animation:ty1 0.48s steps(15,end) 1.052s forwards,gone .01s 1.552s forwards}
@keyframes ty1{to{transform:translateX(117.0px)}}
.t2{animation:ty2 0.832s steps(26,end) 1.902s forwards,gone .01s 2.754s forwards}
@keyframes ty2{to{transform:translateX(202.8px)}}
.pet-in{animation:rise .3s cubic-bezier(.16,1,.3,1) 0.702s both}
.out{animation:show .2s ease-out both}
.o1{animation-delay:1.652s}
.o2a{animation-delay:2.854s}
.o2b{animation-delay:2.934s}
.tail{animation:show .01s 3.104s both}
.caret{animation:show .01s 3.104s both,cblink 1.06s step-end 3.104s infinite}
@keyframes cblink{0%,50%{opacity:1}50.01%,100%{opacity:0}}
.eyes-open{animation:blinkA 5.2s 4.104s infinite}
.eyes-shut{animation:blinkB 5.2s 4.104s infinite}
@keyframes blinkA{0%,93%{opacity:1}93.01%,96%{opacity:0}96.01%,100%{opacity:1}}
@keyframes blinkB{0%,93%{opacity:0}93.01%,96%{opacity:1}96.01%,100%{opacity:0}}
@media(prefers-reduced-motion:reduce){
.type,.eyes-shut{display:none}
.blk,.pet-in,.out,.tail,.caret,.eyes-open{animation:none;opacity:1;transform:none}
}
</style>
<rect x="0.5" y="0.5" width="599" height="301" rx="10" class="win"/>
<path d="M0.5 10.5a10 10 0 0 1 10-10h579a10 10 0 0 1 10 10V34H0.5Z" class="bar"/>
<line x1="0.5" y1="34" x2="599.5" y2="34" class="edge"/>
<circle cx="20" cy="17.5" r="5" fill="#ff5f57"/>
<circle cx="38" cy="17.5" r="5" fill="#febc2e"/>
<circle cx="56" cy="17.5" r="5" fill="#28c840"/>
<text class="title" x="300.0" y="21.5" text-anchor="middle">~/yuki</text>

<g clip-path="url(#inner)">
<g class="blk b0"><text x="22" y="58" textLength="101.4" lengthAdjust="spacing"><tspan class="p">$</tspan> <tspan>yuki whoami</tspan></text><g class="type t0"><rect class="cur" x="37.6" y="47" width="7.8" height="15"/><rect class="cover" x="45.4" y="43" width="600" height="21"/></g></g>

<g class="pet-in">
<text class="pet" x="29.8" y="80" textLength="39.0" lengthAdjust="spacing">/\_/\</text>
<text class="pet eyes-shut" x="22" y="101" textLength="54.6" lengthAdjust="spacing">( -.- )</text>
<text class="pet eyes-open" x="22" y="101" textLength="54.6" lengthAdjust="spacing">( o.o )</text>
<text class="pet" x="29.8" y="122" textLength="39.0" lengthAdjust="spacing">&gt; ^ &lt;</text>
<text x="116" y="80" textLength="101.4" lengthAdjust="spacing">hi, i'm yuki.</text>
<text x="116" y="101" textLength="249.6" lengthAdjust="spacing">i build AI agents, eval systems,</text>
<text x="116" y="122" textLength="156.0" lengthAdjust="spacing">and developer tools.</text>
</g>

<g class="blk b1"><text x="22" y="154" textLength="132.6" lengthAdjust="spacing"><tspan class="p">$</tspan> <tspan>yuki background</tspan></text><g class="type t1"><rect class="cur" x="37.6" y="143" width="7.8" height="15"/><rect class="cover" x="45.4" y="139" width="600" height="21"/></g></g>
<text class="out o1" x="22" y="175" textLength="335.4" lengthAdjust="spacing">i studied architecture before i wrote code.</text>

<g class="blk b2"><text x="22" y="207" textLength="218.4" lengthAdjust="spacing"><tspan class="p">$</tspan> <tspan>yuki what-keeps-me-curious</tspan></text><g class="type t2"><rect class="cur" x="37.6" y="196" width="7.8" height="15"/><rect class="cover" x="45.4" y="192" width="600" height="21"/></g></g>
<text class="out o2a" x="22" y="228" textLength="327.6" lengthAdjust="spacing">the jump from “it works” to “it’s useful”.</text>
<text class="out o2b" x="22" y="249" textLength="288.6" lengthAdjust="spacing">building it, testing it, finding out.</text>

<g class="tail">
<text x="22" y="281" textLength="7.8" lengthAdjust="spacing" class="p">$</text>
<rect class="caret" x="37.6" y="270" width="7.8" height="15"/>
</g>
</g>
</svg>
