<svg xmlns="http://www.w3.org/2000/svg" width="600" height="354" viewBox="0 0 600 354" role="img" aria-labelledby="title desc">
<title id="title">A conversation with Yuki</title>
<desc id="desc">Yuki studied architecture and now builds AI agents and developer tools, exploring what makes them useful through building and testing.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;font-size:17px;fill:#24292f}
.label{font-size:11px;font-weight:600;letter-spacing:1.5px;fill:#656d76}
.incoming{fill:#eef0f3}.outgoing{fill:#0969da}.reply{fill:#fff}
.dot{fill:#8c959f;animation:bounce .65s ease-in-out infinite alternate}
.message{animation:appear .38s cubic-bezier(.16,1,.3,1) both}
.typing{animation:typing 1.05s both}
@keyframes appear{from{opacity:0;transform:translateY(6px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes typing{0%,100%{opacity:0}15%,80%{opacity:1}}
@keyframes bounce{to{transform:translateY(-4px)}}
@media(prefers-color-scheme:dark){text{fill:#e6edf3}.label{fill:#9199a4}.incoming{fill:#262c36}.outgoing{fill:#2478db}.reply{fill:#fff}}
@media(prefers-reduced-motion:reduce){.message{animation:none}.typing{display:none}.dot{animation:none}}
</style>
<text x="18" y="25" class="label">A LITTLE INTRO / YUKI</text>

<g transform="translate(18 58)"><g class="typing" style="animation-delay:0s"><rect class="incoming" width="68" height="38" rx="19"/>
<g transform="translate(22 20)"><circle class="dot" r="3" style="animation-delay:0.0s"/></g>
<g transform="translate(34 20)"><circle class="dot" r="3" style="animation-delay:0.15s"/></g>
<g transform="translate(46 20)"><circle class="dot" r="3" style="animation-delay:0.3s"/></g>
</g></g>
<g transform="translate(18 58)"><g class="message" style="animation-delay:1.05s;transform-origin:0px 44px"><rect class="incoming" width="262" height="44" rx="19"/>
<text x="18" y="27" class="body">Hey Yuki! What do you build?</text>
</g></g>
<g transform="translate(514 116)"><g class="typing" style="animation-delay:0.95s"><rect class="incoming" width="68" height="38" rx="19"/>
<g transform="translate(22 20)"><circle class="dot" r="3" style="animation-delay:0.0s"/></g>
<g transform="translate(34 20)"><circle class="dot" r="3" style="animation-delay:0.15s"/></g>
<g transform="translate(46 20)"><circle class="dot" r="3" style="animation-delay:0.3s"/></g>
</g></g>
<g transform="translate(222 116)"><g class="message" style="animation-delay:2.0s;transform-origin:360px 64px"><rect class="outgoing" width="360" height="64" rx="19"/>
<text x="18" y="27" class="reply">I started with buildings.</text>
<text x="18" y="50" class="reply">Now I build AI agents and developer tools.</text>
</g></g>
<g transform="translate(18 198)"><g class="typing" style="animation-delay:2.35s"><rect class="incoming" width="68" height="38" rx="19"/>
<g transform="translate(22 20)"><circle class="dot" r="3" style="animation-delay:0.0s"/></g>
<g transform="translate(34 20)"><circle class="dot" r="3" style="animation-delay:0.15s"/></g>
<g transform="translate(46 20)"><circle class="dot" r="3" style="animation-delay:0.3s"/></g>
</g></g>
<g transform="translate(18 198)"><g class="message" style="animation-delay:3.4s;transform-origin:0px 44px"><rect class="incoming" width="232" height="44" rx="19"/>
<text x="18" y="27" class="body">What keeps you curious?</text>
</g></g>
<g transform="translate(514 256)"><g class="typing" style="animation-delay:3.85s"><rect class="incoming" width="68" height="38" rx="19"/>
<g transform="translate(22 20)"><circle class="dot" r="3" style="animation-delay:0.0s"/></g>
<g transform="translate(34 20)"><circle class="dot" r="3" style="animation-delay:0.15s"/></g>
<g transform="translate(46 20)"><circle class="dot" r="3" style="animation-delay:0.3s"/></g>
</g></g>
<g transform="translate(240 256)"><g class="message" style="animation-delay:4.9s;transform-origin:342px 64px"><rect class="outgoing" width="342" height="64" rx="19"/>
<text x="18" y="27" class="reply">The jump from “it works” to “it’s useful”.</text>
<text x="18" y="50" class="reply">Building it, testing it, finding out.</text>
</g></g>
<text x="581" y="341" text-anchor="end" class="label">LET’S BUILD SOMETHING USEFUL.</text></svg>